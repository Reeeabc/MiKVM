[package]
name = "mikvm"
version = "2.1.0"
edition = "2021"
description = "Ultra-lightweight Rust Win11 tray switcher & software KVM for Redmi G Pro 27U / Xiaomi Smart Monitors"
license = "MIT"
repository = "https://github.com/Reeeabc/MiKVM"

[[bin]]
name = "MiKVM"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Devices_Display",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Dwm",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
