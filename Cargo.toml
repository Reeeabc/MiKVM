[package]
name = "mitv-switch"
version = "2.0.0"
edition = "2021"
description = "Ultra-lightweight Windows 11 tray switcher & keyboard/mouse takeover tool for Redmi G Pro 27U"
license = "MIT"

[[bin]]
name = "MiTV-Switch"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Dwm",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
