# MiKVM 配置示例（复制为 config.ini 后修改）
TvAddress=192.168.1.200:5555
AutoTakeoverOnTv=True
WheelAsDpad=True
DpInput=29
Hdmi1Input=23
Hdmi2Input=24

# 自定义遥控快捷键（留空表示禁用，仅接管电视期间生效）
Key.ReturnDp=Ctrl+Alt+D
Key.Back=Esc
Key.Home=Home
Key.Menu=F12
Key.Voice=F11
Key.VolUp=PgUp
Key.VolDown=PgDn
Key.Mute=Ctrl+Alt+M
Key.BrightnessUp=Ctrl+Alt+Up
Key.BrightnessDown=Ctrl+Alt+Down
Key.Power=Ctrl+Alt+P
