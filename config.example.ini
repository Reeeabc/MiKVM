# MiKVM 配置示例（复制为 config.ini 后修改）
TvAddress=192.168.1.200:5555
AutoTakeoverOnTv=True
EdgeSwitch=True
EdgeResistancePc=120
EdgeResistanceTv=180
ClipboardSync=True
AutoInternalOnTv=False
DebugLog=False
TvMonitorHint=Mi Monitor
TvEdgeSide=Left
DpInput=29
Hdmi1Input=23
Hdmi2Input=24

# 自定义遥控快捷键（留空表示禁用；ReturnDp / ToggleFocus 在多屏待命时也全局生效）
Key.ReturnDp=Ctrl+Alt+D
Key.ToggleFocus=Ctrl+Alt+S
Key.Back=Esc
Key.Home=Home
Key.Menu=F12
Key.Voice=F11
Key.VolUp=PgUp
Key.VolDown=PgDn
Key.Mute=Ctrl+Alt+M
Key.BrightnessUp=Ctrl+Alt+Up
Key.BrightnessDown=Ctrl+Alt+Down
Key.Power=Ctrl+Alt+P
