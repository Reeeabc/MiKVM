name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Fetch latest official scrcpy (Windows 64-bit)
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "MiKVM-Release-Builder" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $($env:GITHUB_TOKEN)" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/Genymobile/scrcpy/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match '^scrcpy-win64-v.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find scrcpy-win64 asset in latest release" }
          Write-Host "Downloading $($asset.name) ($($rel.tag_name))..."
          New-Item -ItemType Directory -Force -Path dist/scrcpy-dl | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile dist/scrcpy-dl/scrcpy.zip -UseBasicParsing
          Expand-Archive -Path dist/scrcpy-dl/scrcpy.zip -DestinationPath dist/scrcpy-dl/extracted -Force
          $inner = Get-ChildItem dist/scrcpy-dl/extracted -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist/scrcpy-bin | Out-Null
          Copy-Item "$($inner.FullName)/*" dist/scrcpy-bin/ -Recurse -Force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package full & lite release archives
        shell: pwsh
        run: |
          # 1. Lite package (binary + assets + docs)
          New-Item -ItemType Directory -Force -Path dist/MiKVM-lite/assets | Out-Null
          Copy-Item target/release/MiKVM.exe dist/MiKVM-lite/MiKVM.exe
          Copy-Item assets/MiTVDaemon.jar, assets/MiTVEdge.jar, assets/MtkDirectTool.jar, assets/VolDirectTool.jar dist/MiKVM-lite/assets/
          Copy-Item config.example.ini, README.md, LICENSE, THIRD_PARTY_NOTICES.md dist/MiKVM-lite/
          Compress-Archive -Path dist/MiKVM-lite/* -DestinationPath dist/MiKVM-windows-x64-lite.zip -Force

          # 2. Full plug-and-play package (includes official scrcpy + adb)
          New-Item -ItemType Directory -Force -Path dist/MiKVM-full/scrcpy | Out-Null
          Copy-Item dist/MiKVM-lite/* dist/MiKVM-full/ -Recurse -Force
          Copy-Item dist/scrcpy-bin/* dist/MiKVM-full/scrcpy/ -Recurse -Force
          Compress-Archive -Path dist/MiKVM-full/* -DestinationPath dist/MiKVM-windows-x64-full.zip -Force

          # 3. Optional TV Xposed module APK (Fcitx5TvFix)
          Copy-Item extras/Fcitx5TvFix/Fcitx5TvFix-v1.0.0.apk dist/Fcitx5TvFix-v1.0.0.apk -Force

          # 4. SHA256 checksums
          $hFull = (Get-FileHash dist/MiKVM-windows-x64-full.zip -Algorithm SHA256).Hash
          $hLite = (Get-FileHash dist/MiKVM-windows-x64-lite.zip -Algorithm SHA256).Hash
          $hApk = (Get-FileHash dist/Fcitx5TvFix-v1.0.0.apk -Algorithm SHA256).Hash
          @(
            "$hFull  MiKVM-windows-x64-full.zip"
            "$hLite  MiKVM-windows-x64-lite.zip"
            "$hApk  Fcitx5TvFix-v1.0.0.apk"
          ) | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiKVM-windows-x64
          path: |
            dist/MiKVM-windows-x64-full.zip
            dist/MiKVM-windows-x64-lite.zip
            dist/Fcitx5TvFix-v1.0.0.apk
            dist/SHA256SUMS.txt

      - name: Prepare release metadata from annotated tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: relmeta
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $tag = $env:GITHUB_REF_NAME
          # actions/checkout@v4 fetches the dereferenced commit SHA by default; explicitly fetch the annotated tag object
          git fetch --force origin "+refs/tags/${tag}:refs/tags/${tag}"
          $objType = (git cat-file -t "refs/tags/$tag" | Out-String).Trim()
          Write-Host "Tag $tag object type: $objType"
          $subject = (git -c i18n.logOutputEncoding=UTF-8 tag -l --format="%(contents:subject)" $tag | Out-String).Trim()
          $body = (git -c i18n.logOutputEncoding=UTF-8 tag -l --format="%(contents:body)" $tag | Out-String).Trim()
          if (-not $subject) { $subject = $tag }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "title=$subject`n", $utf8NoBom)
          if ($body) {
            [System.IO.File]::WriteAllText((Join-Path $PWD "dist/RELEASE_NOTES.md"), $body, $utf8NoBom)
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "has_notes=true`n", $utf8NoBom)
            Write-Host "Extracted release notes ($($body.Length) chars) from tag $tag"
          } else {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "has_notes=false`n", $utf8NoBom)
          }

      - name: Update GitHub Release (with tag release notes)
        if: startsWith(github.ref, 'refs/tags/v') && steps.relmeta.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.relmeta.outputs.title }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            dist/MiKVM-windows-x64-full.zip
            dist/MiKVM-windows-x64-lite.zip
            dist/Fcitx5TvFix-v1.0.0.apk
            dist/SHA256SUMS.txt

      - name: Update GitHub Release (auto-generated notes fallback)
        if: startsWith(github.ref, 'refs/tags/v') && steps.relmeta.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.relmeta.outputs.title }}
          generate_release_notes: true
          files: |
            dist/MiKVM-windows-x64-full.zip
            dist/MiKVM-windows-x64-lite.zip
            dist/Fcitx5TvFix-v1.0.0.apk
            dist/SHA256SUMS.txt

      - name: Ensure existing releases include Fcitx5TvFix APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tags = gh release list --limit 20 --json tagName -q '.[].tagName'
          foreach ($t in $tags) {
            if (-not $t) { continue }
            $assets = gh release view $t --json assets -q '.assets[].name'
            if ($assets -notcontains 'Fcitx5TvFix-v1.0.0.apk') {
              Write-Host "Backfilling Fcitx5TvFix-v1.0.0.apk to $t..."
              gh release upload $t dist/Fcitx5TvFix-v1.0.0.apk
            }
          }
